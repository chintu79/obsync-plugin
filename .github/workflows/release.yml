name: Release Obsync plugin

on:
    push:
        tags:
            - '*'

permissions:
    contents: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npx tsc -noEmit -skipLibCheck

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            - name: Attest build provenance
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: '${{ github.workspace }}/main.js, ${{ github.workspace }}/manifest.json, ${{ github.workspace }}/styles.css'

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release create "$tag" \
                    --title="$tag" \
                    --notes "Obsync $tag — see the changelog in the repo." \
                    main.js manifest.json styles.css
